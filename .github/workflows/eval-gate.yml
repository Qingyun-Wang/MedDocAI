name: Eval Gate

# Phase 2 of CI/CD: a RAGAS smoke-eval that BLOCKS a PR when answer quality
# regresses. Unit tests prove the code runs; this proves it still answers well.
#
# Scope — the 10 `med_anon` questions only. They are the SQLite-free slice:
# medication_info routes to Qdrant / openFDA / MedlinePlus, never sqlite_tool.
#   - policy / med_patient / care_mgr need data/meddocai.db, which is gitignored
#     and therefore absent on a runner — they would fail 100% of the time.
#   - recall reads LIVE openFDA listings against frozen reference strings, so it
#     goes stale on its own. A gate that reddens because the FDA published a new
#     shortage notice is a gate people disable. Those run in the full local eval.

on:
  pull_request:
    branches: [main]
    # NOTE: deliberately NO `paths:` filter. A workflow skipped by a path filter
    # never creates a check run at all, so as a REQUIRED status check it would sit
    # at "Expected - waiting for status" forever and block every doc-only PR. The
    # path test now lives in the job below, which always runs and always reports -
    # green in ~20s when nothing relevant changed, full eval when it did.
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ragas-smoke:
    name: RAGAS smoke-eval (med_anon)
    runs-on: ubuntu-latest
    # 25 was too tight and cost a whole run: the FIRST real firing of this gate
    # timed out before it could render a verdict. MEASURED breakdown of a full
    # green run (34494312789), once PYTHONUNBUFFERED made the phases visible:
    #   Phase A — 10 pipeline queries:   227s  (12%)  17.7-32.8s each, all iter=1
    #   Phase B — RAGAS scoring:        1614s  (88%)
    #   total 33.5 min
    # So the pipeline is NOT the bottleneck — judging it is. 45 min leaves ~11 min
    # of headroom. If this needs to get faster, raise the RAGAS judge concurrency
    # (evaluation/run_eval.py CONCURRENCY); extending the timeout again would only
    # be treating the symptom.
    timeout-minutes: 45
    # Skip drafts, and skip fork PRs — a fork must never reach repo secrets.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff against the PR base

      - name: Does this PR touch the pipeline?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch - running the full eval"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "changed files:"; echo "$FILES" | sed 's/^/  /'
          if echo "$FILES" | grep -qE '^(agents|graph|tools|models|evaluation)/|^requirements[.]txt$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "-> pipeline code changed: running the full RAGAS eval"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "-> no pipeline code changed: reporting green without spending 33 min"
          fi

      - name: Set up Python 3.11
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache cross-encoder model
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-crossencoder-v1

      - name: Install dependencies (FULL — reranker parity matters here)
        if: steps.changes.outputs.run == 'true'
        # Unlike ci.yml we do NOT strip sentence-transformers. The thresholds below
        # were calibrated with the cross-encoder active; without it the Evidence
        # Filter silently falls back to bi-encoder ordering with different
        # thresholds, shifting the context metrics by an unknown amount and making
        # the calibrated numbers meaningless.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install the eval fixture database
        if: steps.changes.outputs.run == 'true'
        # 26 of the 44 eval questions need a patient record, and data/ is gitignored,
        # so without this the gate can only ever run the 18 that need no patient —
        # leaving personalisation, Medicaid policy, the care-manager persona and
        # fan-out retrieval completely ungated.
        #
        # The fixture is ~216 KB, derived from the real database by
        # scripts/build_eval_fixture_db.py, so it cannot drift into fiction. Copying
        # it to the path the code already hardcodes avoids threading an env var
        # through seven call sites for a CI-only concern.
        #
        # MEDDOCAI_METRICS stays "0" below, so the pipeline does not write
        # query_metrics rows into it.
        run: |
          mkdir -p data
          cp evaluation/fixtures/meddocai_eval.db data/meddocai.db
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/meddocai.db")
          n = c.execute("SELECT COUNT(*) FROM patient_summaries").fetchone()[0]
          print(f"fixture installed: {n} patients")
          assert n >= 13, f"fixture has only {n} patients - rebuild it"
          PY

      - name: Run RAGAS smoke-eval and gate on quality
        if: steps.changes.outputs.run == 'true'
        # 20 questions across five categories, not 10 of one. The previous gate ran
        # med_anon only, so a regression in patient personalisation, Medicaid policy,
        # the care-manager persona or fan-out retrieval shipped green.
        #
        # ANSWER_RELEVANCY IS GATED PER CATEGORY, NOT OVERALL. The categories score
        # legitimately differently on it — med_anon ~0.93, care_mgr ~0.62 — because
        # RAGAS generates questions from the answer and compares them to the original,
        # and a deliberately broad care-manager ask produces a broad multi-topic answer
        # whose generated questions sit far from the vague original. Measured: the two
        # ORIGINAL care_mgr questions score 0.594 on the same system that scores
        # med_anon at 0.93. One aggregate floor therefore either reddens on a healthy
        # run (0.802 for the full set vs a 0.82 floor) or has to be lowered until
        # med_anon could fall 0.93 -> 0.80 unnoticed.
        #
        # faithfulness and context_recall stay OVERALL: they do not vary much by
        # category (faithfulness 0.985 on the new care_mgr questions vs 0.98 med_anon),
        # so one floor is honest there and keeps the config small.
        #
        # Floors sized against observed run-to-run spread, not one run. med_anon over
        # five gate runs: faithfulness 0.979-1.000, relevancy 0.850-0.957,
        # precision 0.749-0.785, recall 0.950 flat. care_mgr relevancy measured
        # 0.594 (original 2 Q) and 0.650 (new 6 Q) -> floor 0.45. A gate that reddens
        # on ordinary judge noise is a gate people switch off.
        #
        # min-category-rows is 2 because policy and diffuse contribute 2 rows each
        # here; the default of 3 would fail them closed.
        #
        # med_patient's relevancy floor is deliberately loose (0.40 against a measured
        # 0.571). It is the WEAKEST category — lower than care_mgr on both relevancy
        # and context_recall (0.750) — and a known open gap: "med_patient
        # context_recall ~0.66 (retrieval coverage)" has been on the list since the
        # first eval round. A tight floor here would fire on the existing weakness
        # rather than on a regression, so this one only catches a collapse until the
        # retrieval gap is actually fixed.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          MEDDOCAI_METRICS: "0"     # don't create a stray SQLite file on the runner
          # Python block-buffers stdout when it is a pipe, so the per-question
          # progress never reached the log and a SLOW run was indistinguishable
          # from a HUNG one — the timeout above was undiagnosable without
          # downloading the artifact. Never debug a long CI job blind.
          PYTHONUNBUFFERED: "1"
        run: |
          python -m evaluation.run_eval \
            --ids med_anon_01,med_anon_02,med_anon_03,med_anon_04,med_anon_05,med_anon_06,med_anon_07,med_anon_08,med_anon_09,med_anon_10,med_pat_01,med_pat_05,med_pat_08,policy_01,policy_05,care_mgr_03,care_mgr_04,care_mgr_05,diffuse_01,diffuse_06 \
            --out "$RUNNER_TEMP/evalout" \
            --tag ci \
            --fail-under faithfulness=0.85 \
            --fail-under context_recall=0.80 \
            --fail-under-category med_anon:answer_relevancy=0.82 \
            --fail-under-category med_anon:context_precision=0.60 \
            --fail-under-category care_mgr:answer_relevancy=0.45 \
            --fail-under-category care_mgr:faithfulness=0.85 \
            --fail-under-category diffuse:faithfulness=0.85             --fail-under-category med_patient:faithfulness=0.85             --fail-under-category med_patient:answer_relevancy=0.40 \
            --min-category-rows 2 \
            --min-scored-frac 0.8 \
            --max-pipeline-errors 0

      - name: Upload eval report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-report
          path: ${{ runner.temp }}/evalout
