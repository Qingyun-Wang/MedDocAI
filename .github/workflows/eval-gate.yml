name: Eval Gate

# Phase 2 of CI/CD: a RAGAS smoke-eval that BLOCKS a PR when answer quality
# regresses. Unit tests prove the code runs; this proves it still answers well.
#
# Scope — the 10 `med_anon` questions only. They are the SQLite-free slice:
# medication_info routes to Qdrant / openFDA / MedlinePlus, never sqlite_tool.
#   - policy / med_patient / care_mgr need data/meddocai.db, which is gitignored
#     and therefore absent on a runner — they would fail 100% of the time.
#   - recall reads LIVE openFDA listings against frozen reference strings, so it
#     goes stale on its own. A gate that reddens because the FDA published a new
#     shortage notice is a gate people disable. Those run in the full local eval.

on:
  pull_request:
    branches: [main]
    # NOTE: deliberately NO `paths:` filter. A workflow skipped by a path filter
    # never creates a check run at all, so as a REQUIRED status check it would sit
    # at "Expected - waiting for status" forever and block every doc-only PR. The
    # path test now lives in the job below, which always runs and always reports -
    # green in ~20s when nothing relevant changed, full eval when it did.
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ragas-smoke:
    name: RAGAS smoke-eval (med_anon)
    runs-on: ubuntu-latest
    # 25 was too tight and cost a whole run: the FIRST real firing of this gate
    # timed out before it could render a verdict. MEASURED breakdown of a full
    # green run (34494312789), once PYTHONUNBUFFERED made the phases visible:
    #   Phase A — 10 pipeline queries:   227s  (12%)  17.7-32.8s each, all iter=1
    #   Phase B — RAGAS scoring:        1614s  (88%)
    #   total 33.5 min
    # So the pipeline is NOT the bottleneck — judging it is. 45 min leaves ~11 min
    # of headroom. If this needs to get faster, raise the RAGAS judge concurrency
    # (evaluation/run_eval.py CONCURRENCY); extending the timeout again would only
    # be treating the symptom.
    timeout-minutes: 45
    # Skip drafts, and skip fork PRs — a fork must never reach repo secrets.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff against the PR base

      - name: Does this PR touch the pipeline?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch - running the full eval"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "changed files:"; echo "$FILES" | sed 's/^/  /'
          if echo "$FILES" | grep -qE '^(agents|graph|tools|models|evaluation)/|^requirements[.]txt$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "-> pipeline code changed: running the full RAGAS eval"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "-> no pipeline code changed: reporting green without spending 33 min"
          fi

      - name: Set up Python 3.11
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache cross-encoder model
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-crossencoder-v1

      - name: Install dependencies (FULL — reranker parity matters here)
        if: steps.changes.outputs.run == 'true'
        # Unlike ci.yml we do NOT strip sentence-transformers. The thresholds below
        # were calibrated with the cross-encoder active; without it the Evidence
        # Filter silently falls back to bi-encoder ordering with different
        # thresholds, shifting the context metrics by an unknown amount and making
        # the calibrated numbers meaningless.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAGAS smoke-eval and gate on quality
        if: steps.changes.outputs.run == 'true'
        # Thresholds sized against OBSERVED run-to-run spread, not a single run.
        # Across three full runs med_anon scored:
        #   faithfulness 0.970 / 0.962 / 0.955   -> floor 0.85 (margin ~0.11)
        #   answer_relevancy 0.954 / 0.927 / 0.951 -> floor 0.82 (margin ~0.11)
        #   context_recall 0.950 / 0.950 / 0.950 -> floor 0.82 (margin ~0.13)
        #   context_precision 0.823 / 0.839 / 0.754 -> floor 0.60 (margin ~0.15)
        # context_precision is by far the most volatile (spread 0.085 vs <0.03 for
        # the rest), so it gets the widest margin. A gate that reddens on ordinary
        # judge noise is a gate people switch off.
        # At n=10 one question swinging 1.0 -> 0.5 moves the mean by 0.05.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          MEDDOCAI_METRICS: "0"     # don't create a stray SQLite file on the runner
          # Python block-buffers stdout when it is a pipe, so the per-question
          # progress never reached the log and a SLOW run was indistinguishable
          # from a HUNG one — the timeout above was undiagnosable without
          # downloading the artifact. Never debug a long CI job blind.
          PYTHONUNBUFFERED: "1"
        run: |
          python -m evaluation.run_eval \
            --ids med_anon_01,med_anon_02,med_anon_03,med_anon_04,med_anon_05,med_anon_06,med_anon_07,med_anon_08,med_anon_09,med_anon_10 \
            --out "$RUNNER_TEMP/evalout" \
            --tag ci \
            --fail-under faithfulness=0.85 \
            --fail-under answer_relevancy=0.82 \
            --fail-under context_recall=0.82 \
            --fail-under context_precision=0.60 \
            --min-scored-frac 0.8 \
            --max-pipeline-errors 0

      - name: Upload eval report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-report
          path: ${{ runner.temp }}/evalout
